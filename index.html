<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Hub - Recipe Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="hero">
    <div class="hero-content">
      <h1>Culinary Hub</h1>
      <p>Find inspiration for your next meal in seconds</p>
    </div>
  </header>

  <main class="container">
    <!-- Filter Form -->
    <form id="recipeForm" class="filter-card">
      <div class="form-row">
        
        <div class="input-group">
          <label for="searchInput">Main Ingredient:</label>
          <input 
            type="search" 
            id="searchInput" 
            placeholder="e.g. Chicken, Pasta, Rice..."
          >
        </div>

        <div class="input-group">
          <label for="categorySelect">Category:</label>
          <select id="categorySelect">
            <option value="">All Categories</option>
            <option value="Seafood">Seafood</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Dessert">Dessert</option>
            <option value="Beef">Beef</option>
            <option value="Chicken">Chicken</option>
          </select>
        </div>

      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Search Recipes</button>
      </div>
    </form>

    <!-- Tab-uri pentru comutare între All Recipes și Saved Recipes -->
    <div class="tabs">
      <button id="tabAll" class="tab-btn active" onclick="switchTab('all')">All Recipes</button>
      <button id="tabFavorites" class="tab-btn" onclick="switchTab('favorites')">Saved Recipes ❤️</button>
    </div>

    <!-- Results Grid -->
    <section id="resultsContainer" class="recipe-grid" aria-live="polite">
      <!-- Recipe cards loaded dynamically via JS -->
    </section>

    <!-- HTML5 Modal Dialog for Details -->
    <dialog id="recipeModal" class="modal">
      <div class="modal-content">
        <button id="closeModal" class="close-btn">&times;</button>
        <div id="modalDetails"></div>
      </div>
    </dialog>
  </main>

  <footer>
    <p>&copy; 2026 Web Project. Data provided by TheMealDB API.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
